[project]
name = "tokenetics"
version = "0.1.0"
description = "A stateless SDK wrapper that shapes both sides of an Anthropic API request to cut token cost without degrading response quality."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dishti Oberai", email = "dishtioberai@gmail.com" }]
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
plugins = [
    # opt-in tier: heavier compression/caching plugins
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenetics"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true

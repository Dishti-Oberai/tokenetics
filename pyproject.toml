[project]
name = "tokenetics"
version = "0.1.0"
description = "A stateless SDK wrapper that shapes both sides of an Anthropic API request to cut token cost without degrading response quality."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dishti Oberai", email = "dishtioberai@gmail.com" }]
keywords = ["anthropic", "claude", "llm", "token-optimization", "prompt-caching", "cost-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/Dishti-Oberai/tokenetics"
Repository = "https://github.com/Dishti-Oberai/tokenetics"
Issues = "https://github.com/Dishti-Oberai/tokenetics/issues"

[project.optional-dependencies]
# Tier 2 extras (Phase 10) -- kept out of the base install per CLAUDE.md's
# "Tier 2 dependencies never leak into the core install" constraint. Each
# group is independent; a base `pip install tokenetics` pulls in neither.
compress = [
    "torch>=2.0",
    "transformers>=4.40",
]
semantic-cache = [
    "sentence-transformers>=3.0",
]
mcp = [
    "mcp[cli]>=2.0.0",
]

[project.scripts]
tokenetics-mcp = "tokenetics.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenetics"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Raised from 3.10 to 3.12 (2026-08-10, Phase 10b/10c): numpy's bundled
# stubs (pulled in transitively by sentence-transformers/torch, touched
# only via `Any`-typed calls in extras/semantic_cache.py and
# extras/compress.py) use PEP 695 `type` aliases, which mypy refuses to
# parse below python_version=3.12 -- a known numpy/mypy interaction, not a
# real issue in our own code, and there's no supported per-module override
# for this setting. This is purely mypy's own typing-feature-availability
# assumption; it does NOT change the project's actual supported-runtime
# floor, which stays `requires-python = ">=3.10"` below and is enforced at
# install time, not by this setting.
python_version = "3.12"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
# numpy and mcp added 2026-09-05: numpy is a transitive dep of
# sentence-transformers/torch (see the python_version comment above); mcp
# is its own Phase 12 extra (`tokenetics[mcp]`). Both are present in a venv
# that has those extras installed -- but CI's `uv sync` installs base + dev
# only, where neither is present at all, not just unstubbed. Caught by
# actually simulating CI's exact environment (`UV_PROJECT_ENVIRONMENT=...
# uv sync` with no extras, then `mypy src` against that interpreter) rather
# than trusting a local run where the extras happened to already be
# installed and never surfaced either gap.
module = [
    "sentence_transformers", "sentence_transformers.*",
    "torch", "torch.*",
    "transformers", "transformers.*",
    "numpy", "numpy.*",
    "mcp", "mcp.*",
]
ignore_missing_imports = true

# mcp_server.py's @mcp.tool() decorator is a special case of the same
# extras-not-installed-in-CI problem: unlike numpy/torch/etc (poorly typed
# even when installed), `mcp` genuinely ships full stubs (py.typed) -- so
# when it IS installed (a local dev venv with the `mcp` extra), mypy sees a
# real, fully-typed decorator; when it's ABSENT (CI's plain `uv sync`), the
# module above falls back to Any via ignore_missing_imports, and mypy's
# strict `disallow_untyped_decorators` then complains that decorating an
# annotated function with an Any-typed decorator makes it untyped. A
# `# type: ignore` comment on the decorator line would be correct in one
# environment and a stale "unused ignore" error in the other -- an
# environment-dependent flip a line comment can't express. Disabling this
# one strict flag for just this module (not project-wide) sidesteps that
# instead of chasing it per-environment.
[[tool.mypy.overrides]]
module = "tokenetics.mcp_server"
disallow_untyped_decorators = false
